<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="users.css">
</head>

<body>

    <div class="container">

        <h1>User Management</h1>

        <div class="search-box">

            <label for="searchUser">
                Search User:
            </label>

            <input
                type="text"
                id="searchUser"
                placeholder="Search by name or email"
            >

        </div>


        <div class="filters">

            <div class="filter-group">

                <label for="roleFilter">
                    Role:
                </label>

                <select id="roleFilter">

                    <option value="all">
                        All
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                    <option value="user">
                        User
                    </option>

                    <option value="moderator">
                        Moderator
                    </option>

                </select>

            </div>


            <div class="filter-group">

                <label for="sortBy">
                    Sort By:
                </label>

                <select id="sortBy">

                    <option value="default" selected>
                        selected
                    </option>

                    <option value="name-az">
                        Name A-Z
                    </option>

                    <option value="name-za">
                        Name Z-A
                    </option>

                </select>

            </div>

        </div>


        <div
            class="loading-state"
            id="loadingState"
        >
            Loading users...
        </div>


        <div
            class="error-state"
            id="errorState"
        >

            <p>
                Unable to load users.
            </p>

            <button
                type="button"
                id="retryBtn"
            >
                Retry
            </button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Age</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                </tbody>
            </table>
        </div>
        <div
            class="empty-state"
            id="emptyState"
        >
            No users found.
        </div>


        <div class="pagination">

            <button
                class="pagination-btn"
                id="previousBtn"
            >
                Previous
            </button>


            <button class="page-btn active-page">
                1
            </button>

            <button class="page-btn">
                2
            </button>

            <button class="page-btn">
                3
            </button>

            <button class="page-btn">
                4
            </button>

            <button class="page-btn">
                5
            </button>


            <button
                class="pagination-btn"
                id="nextBtn"
            >
                Next
            </button>

        </div>

    </div>


    <!-- Edit User Modal -->

    <div
        class="modal"
        id="editModal"
    >

        <div class="modal-content">

            <h2>
                Edit User
            </h2>


            <form id="editUserForm">

                <input
                    type="hidden"
                    id="editUserId"
                >


                <label for="editName">
                    Name
                </label>

                <input
                    type="text"
                    id="editName"
                    required
                >


                <label for="editEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="editEmail"
                    required
                >


                <label for="editRole">
                    Role
                </label>

                <select id="editRole">

                    <option value="admin">
                        Admin
                    </option>

                    <option value="user">
                        User
                    </option>

                    <option value="moderator">
                        Moderator
                    </option>

                </select>


                <div class="modal-buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Changes
                    </button>


                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelEdit"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="users.js"></script>

</body>
</html>
