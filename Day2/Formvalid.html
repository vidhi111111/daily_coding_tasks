<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form Validation</title>
    <link rel="stylesheet" href="formvalid.css">
</head>

<body>

<main>
    <form id="registrationForm">

        <h1>User Registration</h1>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name">
            <small id="nameError"></small>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email">
            <small id="emailError"></small>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="text" id="mobile" name="mobile">
            <small id="mobileError"></small>
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">
        </div>

        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="password-box">
                <input type="password" id="password" name="password">
                <button type="button" id="showPassword">👁</button>
            </div>

            <small id="passwordError"></small>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>

            <div class="password-box">
                <input type="password" id="confirmPassword" name="confirmPassword">
                <button type="button" id="showConfirmPassword">👁</button>
            </div>

            <small id="confirmPasswordError"></small>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" name="address"></textarea>
        </div>

        <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country">
                <option value="">Select Country</option>
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
            </select>
        </div>

        <div class="form-group">
            <label for="state">State</label>
            <select id="state" name="state">
                <option value="">Select State</option>
                <option value="haryana">Haryana</option>
                <option value="punjab">Punjab</option>
                <option value="delhi">Delhi</option>
            </select>
        </div>

        <div class="terms">
            <input type="checkbox" id="terms">
            <label for="terms">I accept the Terms & Conditions</label>
        </div>

        <small id="termsError"></small>

        <div class="button-group">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

        <p id="successMessage"></p>

    </form>
</main>

<script src="formvalid.js"></script>

</body>
</html>
